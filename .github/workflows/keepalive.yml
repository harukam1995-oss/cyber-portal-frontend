# Render 無料プランのバックエンドがスリープしないよう /healthz を定期 ping する。
# アクティブ時間帯: 22:00-15:59 UTC ( = 07:00-00:59 JST、18時間 )。それ以外(JST 01-07)は
# スリープ許容。18h/日 ≒ 540h/月 で無料プランの 750 インスタンス時間/月に収まる
# (24h 常時起動にすると ~720h で上限ギリギリになり、月次で超過→サービス停止のリスク)。
# 公開リポジトリなので Actions の実行時間は無制限。/healthz は認証不要で秘密情報も不要。
# 2026/09/15: 10分間隔だと GitHub 側の遅延で実際の間隔が15分を超える回が約3割あり（直近98回中33回）、
# その間に Render がスリープしていた。5分間隔にし、混み合う毎時0分を避けて 2,7,12…分に実行する
# （起きている時間は変わらないので、Render のインスタンス時間は増えない）。
name: keep-alive

on:
  schedule:
    - cron: "2-57/5 22-23,0-15 * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping backend /healthz
        run: |
          URL="https://cyber-portal-backend.onrender.com/healthz"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "backend did not return 200 after 3 attempts"
          exit 1
